<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$</title>
  <style>
    :root { --accent: #155e75; --ink: #16324f; --muted: #50667c; --line: #c8d3dc; }
    body { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); max-width: 960px; margin: 0 auto; padding: 42px 28px; line-height: 1.7; }
    header { border-top: 5px solid var(--accent); padding-top: 22px; margin-bottom: 26px; }
    h1 { font-size: 2rem; margin: 0 0 8px; } h2 { border-bottom: 2px solid var(--accent); padding-bottom: 6px; margin-top: 36px; }
    table { border-collapse: collapse; width: 100%; margin: 14px 0; } th, td { border: 1px solid var(--line); padding: 8px; vertical-align: top; } th { background: #edf4f6; }
    .meta { color: var(--muted); font-size: .92rem; } .notice { background: #f5f8fb; border-left: 4px solid var(--accent); padding: 12px; }
  </style>
</head>
<body>
<header><div class="meta">RFP 项目文档套件 · $title$</div></header>
<main>$body$</main>
</body>
</html>
