opening: '北京示例科技有限公司：


  在对贵单位递交的投标（应答）文件进行清标与评审过程中，评标委员会（清标工作组）发现下列事项需要贵单位予以澄清或补充证明材料。请严格按照本函所列事项逐条书面回复，并附相应证明材料。


  本函为草稿，未经采购人批准不得对外发送。逾期未复或回复不符合招标文件要求的，评标委员会可按招标文件及有关规定处理。

  '
closing: '回复要求：

  一、请逐项对应澄清事项编号作答，不得遗漏；

  二、证明材料应清晰可辨，加盖单位公章，并标注与事项编号的对应关系；

  三、如涉及报价调整，须符合招标文件关于澄清、补正的规定，不得借澄清改变投标实质性内容；

  四、请将回复文件密封提交（或按招标文件规定的电子渠道上传），并注明项目名称、项目编号及“澄清回复”字样。


  特此函告。

  '
