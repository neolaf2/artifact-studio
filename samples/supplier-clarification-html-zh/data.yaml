  response_format: 书面说明并附证明材料
- id: 澄-003
  requirement_id: REQ-015
  problem_id: PRB-003
  item: 分项报价与开标一览表一致性
  reference: 开标一览表 / 分项报价表
  finding: 分项合价与投标总价存在差额，且未说明是否含增值税及适用税率。
  question: 请核对并说明分项报价表与开标一览表金额差异原因，明确报价是否含税及税率；如需补正，请按招标文件规定提交更正说明（不得改变实质性报价条件，除非文件允许）。
  materials:
  - 差异说明函
  - 修订后的分项报价表（如招标文件允许）
  response_format: 书面说明；必要时提交更正表
