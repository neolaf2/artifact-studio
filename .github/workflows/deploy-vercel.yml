# Deploy `web/` to the existing Vercel project `artifact-studio-web`.
# Product env (LLM keys, durable-save GitHub token, etc.) stays on Vercel —
# this workflow only builds and deploys; it does not set or overwrite those vars.
#
# Required GitHub Actions secrets (repo → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — https://vercel.com/account/tokens
#   VERCEL_ORG_ID       — team_6ukcUUfwObUt61OoQjXp2XSK
#   VERCEL_PROJECT_ID   — prj_2mDveFfv8Zl2pZTGBIdAZgXheRYQ

name: Deploy Web to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-vercel.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: vercel-web-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.target.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: |
          if [ "${{ steps.target.outputs.prod }}" = "true" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy prebuilt
        id: deploy
        run: |
          set -euo pipefail
          if [ "${{ steps.target.outputs.prod }}" = "true" ]; then
            URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed to: ${URL}"

      - name: Summary
        run: |
          {
            echo "### Vercel deploy"
            echo "- **Target:** ${{ steps.target.outputs.environment }}"
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
            echo "- **Event:** ${{ github.event_name }} @ \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
